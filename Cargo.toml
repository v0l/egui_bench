[package]
name = "egui_bench"
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "MIT AND OFL-1.1"
description = "Bench-instrument theme and components for egui: chassis greys, engraved legends, amber readouts, cyan traces."
repository = "https://github.com/v0l/egui_bench"
readme = "README.md"
keywords = ["egui", "gui", "theme", "instrument", "widgets"]
categories = ["gui"]
exclude = ["docs/*"]

[features]
viewer3d = ["dep:egui-wgpu", "dep:wgpu", "dep:bytemuck"]
update = ["dep:ureq", "dep:serde_json", "dep:flate2", "dep:tar", "dep:sha2", "dep:zip"]
markdown = ["dep:pulldown-cmark"]
agent = ["markdown", "dep:ureq", "dep:serde", "dep:serde_json", "dep:dirs"]
sandbox = ["agent", "dep:nono"]
# Whisper and Kokoro, run in this process through candle. Pulls in candle, so it is off unless asked for.
speech = ["agent", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:byteorder", "dep:tracing", "dep:rand", "dep:rand_distr"]
# Run them on an NVIDIA card when there is one. The CUDA runtime is loaded when first needed, so a
# build with this still runs on a machine with no card (see the candle patch in waveshark).
speech-cuda = ["speech", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
speech-metal = ["speech", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nono = { version = "0.80", default-features = false, optional = true }

[dependencies]
bytemuck = { version = "1.25", features = ["derive"], optional = true }
byteorder = { version = "1", optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
tracing = { version = "0.1", optional = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"], optional = true }
rand_distr = { version = "0.5", optional = true }
dirs = { version = "6", optional = true }
egui = "0.35"
egui-wgpu = { version = "0.35", optional = true }
flate2 = { version = "1.1.10", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.1", optional = true }
tar = { version = "0.4.46", optional = true }
ureq = { version = "3.4", optional = true }
web-time = "1"
wgpu = { version = "29", default-features = false, features = ["wgsl"], optional = true }
zip = { version = "9.0.2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu"] }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }

[[test]]
name = "viewer3d"
required-features = ["viewer3d"]

[[test]]
name = "trace"
required-features = ["viewer3d"]

[[test]]
name = "materials"
required-features = ["viewer3d"]

[[test]]
name = "agent_sandbox"
path = "tests/agent_sandbox.rs"
harness = false
required-features = ["sandbox"]

[[example]]
name = "gallery"

[[example]]
name = "viewer3d"
required-features = ["viewer3d"]

[package.metadata.docs.rs]
features = ["viewer3d", "update", "agent", "sandbox", "speech"]

[[example]]
name = "say"
required-features = ["speech"]

[[example]]
name = "hear"
required-features = ["speech"]

[[example]]
name = "phonon_match"
required-features = ["speech"]

[[example]]
name = "phonon_normalize"
required-features = ["speech"]

[[example]]
name = "phonon_say"
required-features = ["speech"]

[[example]]
name = "voicer"
required-features = ["speech"]
